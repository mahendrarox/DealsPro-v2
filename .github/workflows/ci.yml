name: CI

# Runs on every push and every PR, from the first commit. The suite is the
# gate: nothing merges to main while it is red.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Typecheck · unit · RTM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # RTM reads commit subjects for [UC-NNN] tags; a depth-1 clone
          # would make every case look untraced.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (guards)
        run: npm run test:unit
      - name: RTM traceability check
        run: npm run rtm:check
      - name: Fail on known vulnerabilities
        run: npm audit --audit-level=high

  e2e:
    name: Playwright E2E (mobile-first)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Same reason as the gate job: the RTM reads commit subjects.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # Fix 3's claim, checked against the real thing: the built server
      # must die on an unsafe configuration rather than serve. The unit
      # tests prove register() throws; this proves Next calls it.
      - name: Prove startup guards refuse unsafe config (built server)
        run: |
          npm run build
          node scripts/verify-startup-refusal.mjs

      - name: Run E2E
        run: npm run test:e2e
        env:
          CI: "true"
      # The committed RTM is generated without a run, so it honestly
      # claims nothing verified. This regenerates it from the run that
      # just happened, so the artifact shows evidence-backed coverage.
      # It is uploaded, not committed — the repo never carries a coverage
      # number that no run produced.
      - name: Regenerate RTM from the actual run
        if: ${{ !cancelled() }}
        run: npm run rtm

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-results/
            docs/RTM.md
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The repo is public, so any secret that ever lands in a commit is
    # world-readable and must be treated as burned. This job is the gate
    # that keeps that from happening quietly: findings fail the run.
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the whole history, not just the tip. A secret removed in a
          # later commit is still published in the earlier one.
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.0
          # sha256 of gitleaks_8.30.0_linux_x64.tar.gz, from the upstream
          # gitleaks_8.30.0_checksums.txt. Pinned so a re-tagged or swapped
          # release cannot slip a different binary into CI.
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          # Installed OUTSIDE the workspace: the tarball and binary sitting
          # in the repo would themselves be scanned by the working-tree pass.
          cd "$RUNNER_TEMP"
          curl -sSLf --retry 3 --retry-delay 2 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      # --redact keeps any matched value out of the public CI log: the log
      # itself would otherwise publish the secret this job exists to catch.
      # --config is passed explicitly so a missing or renamed .gitleaks.toml
      # fails loudly instead of silently falling back to the default rules.
      - name: Scan git history
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --config .gitleaks.toml \
            --redact --verbose --no-banner --exit-code 1 \
            --report-format sarif --report-path gitleaks-history.sarif

      - name: Scan working tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir . \
            --config .gitleaks.toml \
            --redact --verbose --no-banner --exit-code 1 \
            --report-format sarif --report-path gitleaks-tree.sarif

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: gitleaks-reports
          path: gitleaks-*.sarif
          retention-days: 7
          if-no-files-found: ignore
